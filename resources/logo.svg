<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4f8"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d97f"/>
      <stop offset="32%" stop-color="#19bfe8"/>
      <stop offset="66%" stop-color="#8b2df5"/>
      <stop offset="100%" stop-color="#ff2f91"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#5e7890" flood-opacity="0.18"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer tile -->
  <rect x="36" y="36" width="952" height="952" rx="170"
        fill="url(#bg)" stroke="#d7e1ea" stroke-width="4" filter="url(#shadow)"/>

  <!-- Neon border accent -->
  <rect x="78" y="78" width="868" height="868" rx="132"
        fill="none" stroke="url(#neon)" stroke-width="10" opacity="0.22"/>

  <!-- Top label -->
  <text x="512" y="180" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="56" font-weight="700" fill="#14283e">
    LH SAMPLE SYNTH
  </text>

  <!-- Main emblem circle -->
  <circle cx="512" cy="470" r="230"
          fill="#ffffff" stroke="#dbe5ed" stroke-width="5"/>

  <!-- Waveform -->
  <path d="
    M 305 470
    C 330 470, 330 402, 355 402
    C 380 402, 380 538, 405 538
    C 430 538, 430 355, 455 355
    C 480 355, 480 585, 505 585
    C 530 585, 530 382, 555 382
    C 580 382, 580 520, 605 520
    C 630 520, 630 420, 655 420
    C 680 420, 680 488, 705 488"
        fill="none"
        stroke="url(#neon)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Accent underline -->
  <rect x="330" y="780" width="364" height="14" rx="7"
        fill="url(#neon)" filter="url(#glow)"/>

  <!-- Bottom descriptor -->
  <text x="512" y="865" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30" font-weight="600"
        letter-spacing="4"
        fill="#6f8498">
    RECORDED SOUND INSTRUMENT
  </text>
</svg>
