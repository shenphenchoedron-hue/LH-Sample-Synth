name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
          - os: macos-14
            name: macOS
          - os: windows-2022
            name: Windows
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libcurl4-openssl-dev libgtk-3-dev

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure (macOS / Linux)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify artefacts
        shell: bash
        run: |
          A="build/LHSampleSynth_artefacts/Release"
          test -d "$A/VST3/LH Sample Synth.vst3"
          test -e "$A/CLAP/LH Sample Synth.clap"
          if [ "$RUNNER_OS" = "macOS" ]; then test -d "$A/AU/LH Sample Synth.component"; fi
          if [ "$RUNNER_OS" != "macOS" ]; then test ! -e "$A/AU"; fi
          ls -R "$A" | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: LH-Sample-Synth-${{ matrix.name }}
          path: |
            build/LHSampleSynth_artefacts/Release/VST3
            build/LHSampleSynth_artefacts/Release/CLAP
            build/LHSampleSynth_artefacts/Release/AU
