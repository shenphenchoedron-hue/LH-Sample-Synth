name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # needed by the release job to publish GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
          - os: macos-14
            name: macOS
          - os: windows-2022
            name: Windows
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libcurl4-openssl-dev libgtk-3-dev zip

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure (macOS / Linux)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        shell: bash
        run: |
          EXE=$(find build/LHSampleSynthTests_artefacts -type f \( -name LHSampleSynthTests -o -name LHSampleSynthTests.exe \) | head -1)
          echo "Running $EXE"
          set +e
          "$EXE" > test-output.txt 2>&1
          CODE=$?
          set -e
          cat test-output.txt
          if [ $CODE -ne 0 ]; then
            echo "::error title=Test exit code::$CODE"
            tail -n 15 test-output.txt | tr -d '\r' | while IFS= read -r line; do echo "::error title=test tail::$line"; done
            exit 1
          fi

      - name: Verify artefacts
        shell: bash
        run: |
          A="build/LHSampleSynth_artefacts/Release"
          test -d "$A/VST3/LH Sample Synth.vst3"
          test -e "$A/CLAP/LH Sample Synth.clap"
          if [ "$RUNNER_OS" = "macOS" ]; then test -d "$A/AU/LH Sample Synth.component"; fi
          if [ "$RUNNER_OS" != "macOS" ]; then test ! -e "$A/AU"; fi

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="dev-${GITHUB_SHA::7}" ;; esac
          A="build/LHSampleSynth_artefacts/Release"
          PKG="LH-Sample-Synth-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/$PKG"
          cp -R "$A/VST3/LH Sample Synth.vst3" "dist/$PKG/"
          cp -R "$A/CLAP/LH Sample Synth.clap" "dist/$PKG/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$A/AU/LH Sample Synth.component" "dist/$PKG/"
            cp -R "$A/Standalone/LH Sample Synth.app" "dist/$PKG/"
            for b in "dist/$PKG/"*.vst3 "dist/$PKG/"*.clap "dist/$PKG/"*.component "dist/$PKG/"*.app; do
              codesign --force --deep -s - "$b"   # ad-hoc signature (required on Apple Silicon)
            done
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp "$A/Standalone/LH Sample Synth.exe" "dist/$PKG/"
          else
            cp "$A/Standalone/LH Sample Synth" "dist/$PKG/"
            cp resources/logo-256.png "dist/$PKG/lh-sample-synth.png"
          fi
          cp LICENSE THIRD_PARTY_LICENSES.md "dist/$PKG/"
          cp docs/INSTALL.txt "dist/$PKG/INSTALL.txt"
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$PKG" "$PKG.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$PKG.zip" "$PKG" > /dev/null
          else
            zip -qry "$PKG.zip" "$PKG"
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: LH-Sample-Synth-${{ matrix.name }}
          path: dist/*.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: LH Sample Synth ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*.zip
